[project]
name = "italian_invoice"
authors = [
    { name = "Solede SA", email = "info@solede.com"}
]
description = "Gestione della Fatturazione Elettronica in Italia"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "xmlschema>=3.0.2"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
]
ignore = [
    "B007", # unused-loop-control-variable
    "B009", # get-attr-with-constant
    "B010", # set-attr-with-constant
    "E101", # mixed-spaces-and-tabs
    "E402", # module-import-not-at-top-of-file
    "E501", # line-too-long
    "E722", # bare-except
    "F401", # unused-import
    "F403", # undefined-local-with-import-star
    "F405", # undefined-local-with-import-star-usage
    "UP035", # deprecated-import (typing.Dict -> dict)
    "UP038", # non-pep604-isinstance
    "W191", # tab-indentation (incompatibile con format.indent-style="tab")
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
